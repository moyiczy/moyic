
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<!-- PWA / 添加到主页 支持 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="moyic">
<link rel="manifest" href='data:application/manifest+json,{"name":"moyic","short_name":"moyic","start_url":"./","display":"standalone","background_color":"#ffffff","theme_color":"#ffffff","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'>
<title>moyic</title>
<style>
/* ========== 基础 ========== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --font:"SimSun","宋体","Songti SC",serif;
  --fs:14px;
  --accent:#111111;
  --bg:#f6f6f6;--fg:#111111;--sub:#9b9b9b;--line:#e7e7e7;--card:#ffffff;--hover:#efefef;
  --shadow:0 2px 14px rgba(0,0,0,.06);
}
[data-theme="dark"]{
  --bg:#0a0a0a;--fg:#ededed;--sub:#787878;--line:#1e1e1e;--card:#141414;--hover:#1c1c1c;
  --shadow:0 2px 14px rgba(0,0,0,.4);
}
html,body{height:100%;overflow:hidden;}
body{
  font-family:var(--font);font-size:var(--fs);color:var(--fg);background:#000;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none;}
button{cursor:pointer;}
img{display:block;max-width:100%;}
::-webkit-scrollbar{width:0;height:0;}
/* ========== 屏幕 ========== */
#screen{position:fixed;inset:0;height:100dvh;overflow:hidden;background:var(--bg);}
.page{
  position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);
  background-image:var(--page-bg,none);background-size:cover;background-position:center;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  z-index:1;overflow:hidden;
}
.page.active{transform:translateX(0);}
#page-home{transform:none;z-index:0;}
/* ========== 图标按钮 ========== */
.ibtn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--fg);transition:background .2s;}
.ibtn:active{background:var(--hover);}
/* ========== 顶部栏 ========== */
.topbar{display:flex;align-items:center;padding:6px 8px;gap:4px;border-bottom:1px solid var(--line);flex-shrink:0;}
.tb-title{flex:1;text-align:center;font-size:15px;letter-spacing:2px;font-weight:600;}
.tb-right{min-width:38px;display:flex;justify-content:flex-end;gap:2px;}
.page-inner{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
.pad{padding:14px 16px 30px;}
/* ========== 主屏 ========== */
#page-home{background:var(--bg);}
.home-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0;}
.home-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.14));}
.home-scroll{position:relative;z-index:1;flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;}
.hs-page{min-width:100%;flex:0 0 100%;scroll-snap-align:start;padding:26px 18px 6px;overflow-y:auto;}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;}
.app-icon{
  position:relative;width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:var(--card);box-shadow:var(--shadow);color:var(--fg);transition:transform .16s;
}
.app:active .app-icon{transform:scale(.9);}
.app-name{font-size:11px;color:var(--sub);letter-spacing:1px;}
.badge{
  position:absolute;top:-4px;right:-6px;min-width:17px;height:17px;padding:0 5px;border-radius:9px;
  background:var(--accent);color:var(--bg);font-size:10px;display:flex;align-items:center;justify-content:center;
  font-style:normal;letter-spacing:0;border:2px solid var(--bg);
}
.dots{display:flex;justify-content:center;gap:6px;padding:8px 0;position:relative;z-index:1;}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--sub);opacity:.3;transition:.25s;}
.dots i.on{opacity:.9;width:14px;border-radius:3px;}
.dock{
  position:relative;z-index:1;display:flex;justify-content:space-around;align-items:center;
  margin:0 18px calc(16px + env(safe-area-inset-bottom));padding:12px 0;border-radius:22px;
  background:color-mix(in srgb,var(--card) 72%,transparent);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);
}
.dock .app-icon{box-shadow:none;background:transparent;width:48px;height:48px;}
.dock .app-name{display:none;}
/* ========== 通用卡片 / 列表 ========== */
.card{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.row-label{flex:1;letter-spacing:.5px;}
.row-sub{font-size:11px;color:var(--sub);margin-top:3px;}
.sec-title{font-size:12px;color:var(--sub);letter-spacing:2px;padding:16px 4px 8px;}
.empty{text-align:center;color:var(--sub);padding:50px 0;font-size:12px;letter-spacing:1px;}

.inp{width:100%;background:var(--hover);border-radius:10px;padding:10px 12px;color:var(--fg);}
.inp::placeholder{color:var(--sub);}
.ta{width:100%;min-height:120px;background:var(--hover);border-radius:10px;padding:10px 12px;resize:vertical;line-height:1.7;}
select.inp { appearance: none; -webkit-appearance: none; }
.btn{
  padding:9px 18px;border-radius:10px;background:var(--hover);color:var(--fg);letter-spacing:1px;
  transition:.15s;font-size:13px;
}
.btn:active{opacity:.6;}
.btn.primary{background:var(--accent);color:var(--bg);}
.btn.ghost{border:1px solid var(--line);background:transparent;}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:8px;}
.btn.full{width:100%;}

.switch{width:44px;height:25px;border-radius:13px;background:var(--line);position:relative;transition:.22s;flex-shrink:0;}
.switch::after{content:"";position:absolute;top:2.5px;left:2.5px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.22s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch.on{background:var(--accent);}
.switch.on::after{transform:translateX(19px);background:var(--bg);}

.av{
  width:38px;height:38px;border-radius:50%;background:var(--hover);color:var(--sub);
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;font-size:14px;
}
.av img{width:100%;height:100%;object-fit:cover;}
/* ========== 聊天 ========== */
.chat-head{flex-shrink:0;border-bottom:1px solid var(--line);background:var(--card);}
.ch-top{display:flex;align-items:center;padding:6px 8px;}
.ch-name{flex:1;text-align:center;font-size:15px;letter-spacing:2px;}

.chat-body{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:12px;}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%;animation:pop .22s ease;}
@keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.msg.me{flex-direction:row-reverse;}
.bwrap{display:flex;flex-direction:column;gap:4px;max-width:74%;}
.msg.me .bwrap{align-items:flex-end;}
.mname{font-size:10px;color:var(--sub);padding:0 4px;}
.bubble{
  padding:9px 13px;border-radius:14px;line-height:1.65;word-break:break-word;white-space:pre-wrap;
  background:var(--card);box-shadow:var(--shadow);letter-spacing:.4px;
}
.msg.me .bubble{background:var(--accent);color:var(--bg);}
.msg .bubble.custom{background-size:cover;background-position:center;}
.mtime{font-size:10px;color:var(--sub);padding:0 4px;}
.quote{
  font-size:11px;padding:6px 10px;border-left:2px solid var(--sub);background:var(--hover);
  border-radius:6px;color:var(--sub);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.quote b{color:var(--fg);opacity:.7;font-weight:400;margin-right:4px;}
.sys{text-align:center;font-size:11px;color:var(--sub);letter-spacing:1px;padding:2px 0;}
.sticker-img{max-width:120px;border-radius:10px;}
.transfer{
  display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;
  background:var(--accent);color:var(--bg);min-width:180px;
}
.t-amt{font-size:18px;letter-spacing:1px;}
.t-note{font-size:11px;opacity:.7;margin-top:2px;}
.gift{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--accent);color:var(--bg);min-width:180px;}
.gift img{width:34px;height:34px;border-radius:8px;object-fit:cover;}
.g-name{font-size:14px;letter-spacing:1px;}
.g-note{font-size:11px;opacity:.7;margin-top:2px;}
.typing{font-size:11px;color:var(--sub);padding:0 18px 6px;letter-spacing:1px;flex-shrink:0;}
.typing::after{content:"···";animation:blink 1.2s infinite;}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}

.chat-bar{
  flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--card);
}
.chat-bar .plus{background:var(--hover);border-radius:50%;width:36px;height:36px;}
#msgInput{flex:1;background:var(--hover);border-radius:18px;padding:9px 14px;min-width:0;}
.send{
  padding:9px 16px;border-radius:18px;background:var(--accent);color:var(--bg);letter-spacing:1px;flex-shrink:0;
}
.send:active{opacity:.75;}
/* ========== 弹层 ========== */
.sheet-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:200;display:flex;align-items:flex-end;
  opacity:0;transition:opacity .22s;backdrop-filter:blur(2px);
}
.sheet-mask.in{opacity:1;}
.sheet{
  width:100%;max-height:82vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
}
.sheet-mask.in .sheet{transform:translateY(0);}
.sheet-title{text-align:center;font-size:13px;color:var(--sub);letter-spacing:2px;margin-bottom:14px;}
.sheet-item{display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px solid var(--line);letter-spacing:1px;}
.sheet-item:last-child{border-bottom:none;}
.sheet-item:active{opacity:.55;}
.sheet-btns{display:flex;gap:10px;margin-top:16px;}
.sheet-btns .btn{flex:1;text-align:center;padding:12px;}

.toast{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);z-index:400;
  background:rgba(20,20,20,.9);color:#fff;padding:11px 22px;border-radius:12px;font-size:13px;letter-spacing:1px;
  opacity:0;transition:.24s;pointer-events:none;max-width:74vw;text-align:center;
}
.toast.in{opacity:1;transform:translate(-50%,-50%) scale(1);}
/* ========== 通话 ========== */
.call-overlay{
  position:fixed;inset:0;z-index:300;background:#0d0d0d;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:14vh 0 10vh;transition:.3s;
}
/* 缩小后的电话悬浮窗：纵向椭圆 */
.call-overlay.mini{
  width:100px;height:150px;inset:auto;right:16px;bottom:100px;border-radius:50px;padding:16px 6px;
  box-shadow:0 8px 30px rgba(0,0,0,.6);cursor:grab;justify-content:space-between;
  touch-action:none;-webkit-user-select:none;user-select:none;will-change:left,top;
}
.call-overlay.mini:active{cursor:grabbing;}
.call-av{width:88px;height:88px;border-radius:50%;overflow:hidden;background:#222;display:flex;align-items:center;justify-content:center;font-size:30px;color:#666;}
.call-av img{width:100%;height:100%;object-fit:cover;}
.call-name{font-size:19px;letter-spacing:3px;margin-top:18px;}
.call-time{font-size:13px;color:#999;margin-top:8px;letter-spacing:2px;font-variant-numeric:tabular-nums;}
.call-status{font-size:12px;color:#888;letter-spacing:2px;margin-top:8px;}
.call-btns{display:flex;gap:40px;}
.call-btn{width:64px;height:64px;border-radius:50%;background:#222;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;font-size:10px;letter-spacing:1px;}
.call-btn.hangup{background:#c33;}
.call-btn:active{opacity:.7;}

/* 内部元素缩小适配 */
.call-overlay.mini .call-av{width:36px;height:36px;font-size:14px;}
.call-overlay.mini .call-name{font-size:12px;letter-spacing:1px;margin-top:6px;}
.call-overlay.mini .call-time{font-size:10px;margin-top:2px;}
.call-overlay.mini .call-status{display:none;}
.call-overlay.mini .call-btns{gap:8px;justify-content:center;}
.call-overlay.mini .call-btn{width:32px;height:32px;font-size:0;border-radius:50%;}
.call-overlay.mini .call-btn svg{width:16px;height:16px;}
.call-overlay.mini .call-btn span{display:none;}
/* ========== 朋友圈 / 日记 ========== */
.post{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.post-name{font-size:13px;letter-spacing:1px;}
.post-time{font-size:10px;color:var(--sub);margin-top:2px;}
.post-text{line-height:1.75;letter-spacing:.4px;white-space:pre-wrap;word-break:break-word;}
.post-img{margin-top:10px;border-radius:10px;overflow:hidden;max-height:300px;}
.post-img img{width:100%;object-fit:cover;}
.post-acts{display:flex;gap:22px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--sub);}
.post-acts span{display:flex;align-items:center;gap:5px;letter-spacing:1px;}
.comments{margin-top:10px;background:var(--hover);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;}
.cmt{font-size:12px;line-height:1.6;letter-spacing:.3px;}
.cmt b{font-weight:400;color:var(--sub);}
.likes{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
/* ========== 日历 ========== */
.cal-widget{border-radius:20px;padding:18px;background:var(--card);box-shadow:var(--shadow);margin-bottom:12px;background-size:cover;background-position:center;position:relative;overflow:hidden;}
.cal-widget::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.72);backdrop-filter:blur(2px);}
[data-theme="dark"] .cal-widget::after{background:rgba(0,0,0,.66);}
.cal-widget>*{position:relative;z-index:1;}
.cal-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
.cal-month{font-size:16px;letter-spacing:3px;}
.cal-year{font-size:11px;color:var(--sub);letter-spacing:1px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;}
.cal-grid .wd{font-size:10px;color:var(--sub);padding-bottom:4px;letter-spacing:0;}
.cal-day{font-size:12px;padding:5px 0;border-radius:7px;color:var(--fg);}
.cal-day.dim{opacity:.22;}
.cal-day.today{background:var(--accent);color:var(--bg);}
.cal-day.mark{box-shadow:inset 0 0 0 1px var(--accent);}
/* 拍立得 */
.polaroid{background:var(--card);padding:12px 12px 40px;border-radius:4px;box-shadow:var(--shadow);transform:rotate(-1.6deg);margin:6px 8px 18px;}
.polaroid img{width:100%;height:160px;object-fit:cover;background:var(--hover);border-radius:2px;}
.polaroid .ph{width:100%;height:160px;display:flex;align-items:center;justify-content:center;background:var(--hover);color:var(--sub);border-radius:2px;}
/* ========== 商店 ========== */
.goods{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.good{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
.good-img{height:110px;background:var(--hover);display:flex;align-items:center;justify-content:center;color:var(--sub);overflow:hidden;}
.good-img img{width:100%;height:100%;object-fit:cover;}
.good-body{padding:10px 12px 12px;}
.good-name{font-size:13px;letter-spacing:.5px;}
.good-desc{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.5;height:32px;overflow:hidden;}
.good-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.good-price{font-size:14px;letter-spacing:.5px;}
/* ========== 陪伴 ========== */
.mode-btn{padding:12px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;letter-spacing:1px;font-size:12px;}
.mode-btn.on{background:var(--accent);color:var(--bg);}
.big-timer{font-size:42px;letter-spacing:4px;text-align:center;font-variant-numeric:tabular-nums;padding:20px 0;}
/* ========== 美化 ========== */
.color-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);}
.swatch{display:flex;gap:12px;flex-wrap:wrap;padding:6px 0;}
/* ========== 开场 ========== */
#splash{
  position:fixed;inset:0;z-index:999;background:#0a0a0a;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .8s ease,visibility .8s;
}
#splash.out{opacity:0;visibility:hidden;}
.sp-line{width:0;height:1px;background:#fff;animation:spLine 1.1s cubic-bezier(.2,.8,.2,1) forwards;}
@keyframes spLine{to{width:120px;}}
.sp-name{font-size:26px;letter-spacing:14px;text-indent:14px;opacity:0;animation:spFade .9s .45s forwards;}
.sp-sub{font-size:10px;letter-spacing:6px;color:#666;opacity:0;animation:spFade .9s .8s forwards;}
@keyframes spFade{to{opacity:1;}}
/* 通知条 */
.notif{
  position:fixed;top:10px;left:12px;right:12px;z-index:500;background:var(--card);border-radius:14px;
  padding:12px 16px;box-shadow:0 6px 24px rgba(0,0,0,.2);transform:translateY(-140%);transition:.3s;
  display:flex;gap:10px;align-items:center;
}
.notif.in{transform:translateY(0);}
.notif-t{font-size:12px;letter-spacing:1px;}
.notif-b{font-size:12px;color:var(--sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.bar{height:2px;background:var(--line);border-radius:2px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--accent);}
</style>
</head>
<body>

<div id="screen"></div>

<div id="splash">
  <div class="sp-line"></div>
  <div class="sp-name">moyic</div>
  <div class="sp-sub">PRIVATE SPACE</div>
</div>

<div id="modal-root"></div>

<script>
/* =========================================================
   工具
========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const rand = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2,'0');
const fmtTime = t => { const d=new Date(t); return `${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const fmtDate = t => { const d=new Date(t); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const fmtHM = ms => { const s=Math.floor(ms/1000); return `${pad2(Math.floor(s/60))}:${pad2(s%60)}`; };
function sample(arr,n){ const a=[...arr], out=[]; n=Math.min(n,a.length); for(let i=0;i<n;i++) out.push(a.splice(rand(0,a.length-1),1)[0]); return out; }
function toast(msg){ const d=document.createElement('div'); d.className='toast'; d.textContent=msg; document.body.appendChild(d); requestAnimationFrame(()=>d.classList.add('in')); setTimeout(()=>{d.classList.remove('in'); setTimeout(()=>d.remove(),260);},1500); }
/* =========================================================
   图标
========================================================= */
const ICONS = {

function deepMerge(base, extra){
  if(Array.isArray(extra)) return extra;
  if(typeof extra !== 'object' || extra === null) return extra;
  const out = Array.isArray(base) ? [] : {...base};
  for(const k in extra){
    if(typeof base[k]==='object' && base[k]!==null && !Array.isArray(base[k]) && typeof extra[k]==='object' && extra[k]!==null && !Array.isArray(extra[k])){
      out[k] = deepMerge(base[k], extra[k]);
    } else {
      out[k] = extra[k];
    }
  }
  return out;
}

function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      DB = deepMerge(defaultDB(), p);
    }
  }catch(e){ console.warn('读取失败', e); DB = defaultDB(); }
}
function saveDB(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }

let AC = null;
function beep(){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.09, AC.currentTime + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 0.19);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + 0.2);
  }catch(e){}
}
function playSendSound(){
  const st = S();
  if(!st.soundOn) return;
  const list = st.sounds || [];
  if(list.length){
    const src = st.soundRandom ? list[rand(0, list.length - 1)] : list[0];
    try{ const a = new Audio(src); a.volume = 0.6; a.play().catch(()=>{}); }catch(e){}
  } else beep();
}

const pages = {};
let stack = ['home'];
const curPage = () => stack[stack.length - 1];

function getPage(id){
  if(!pages[id]){
    const el = document.createElement('div');
    el.className = 'page';
    el.id = 'page-' + id;
    document.getElementById('screen').appendChild(el);
    pages[id] = el;
  }
  return pages[id];
}
function openPage(id, data){
  const el = getPage(id);
  if(id === 'chat'){
    renderPage('chat');
    refreshChat();
  } else {
    renderPage(id, data || {});
  }
  
  // 清除对应的未读角标
  if (DB.unread[id] > 0) {
    DB.unread[id] = 0;
    saveDB();
  }

  requestAnimationFrame(() => el.classList.add('active'));
  if(curPage() !== id) stack.push(id);
  updateAllBadges();
}
function closePage(){
  if(stack.length <= 1) return;
  const id = stack.pop();
  const el = pages[id];
  if(el) el.classList.remove('active');
  renderPage('home');
  updateAllBadges();
}
function renderPage(id, data){
  const el = pages[id];
  if(!el) return;
  const tpl = {
    home: tplHome, chat: tplChat, cards: tplCards, moments: tplMoments, diary: tplDiary,
    calendar: tplCalendar, shop: tplShop, music: tplMusic, company: tplCompany,
    beauty: tplBeauty, settings: tplSettings, me: tplMe
  }[id];
  if(tpl){ el.innerHTML = tpl(); bindPage(id, el); }
}

function quoteText(m){
  if(!m) return '';
  if(m.type === 'sticker') return '[表情包]';
  if(m.type === 'transfer') return `[转账 ¥${m.amount}]`;
  if(m.type === 'gift') return `[礼物 ${m.name}]`;
  return m.text || '';
}
function addMsg(m){
  m.id = m.id || uid();
  m.time = m.time || Date.now();
  m.read = m.read || false;
  DB.messages.push(m);
  saveDB();
  if(curPage() === 'chat') refreshChat();
  if(m.from === 'ta'){
    if(curPage() !== 'chat') bumpUnread('chat');
    notify(S().ta.name, quoteText(m));
  }
}
function isGroupBlocked(g){
  const grp = DB.groups.find(x => x.name === g);
  return grp ? grp.blocked : false;
}

function scheduleReply(userMsg){
  const st = S();
  if(st.noReplyOn && Math.random() * 100 < st.noReplyChance) return;
  const delay = rand(st.replyDelayMin * 1000, st.replyDelayMax * 1000);
  setTimeout(() => { if(curPage() === 'chat') showTyping(true); }, Math.min(900, Math.floor(delay / 2)));
  setTimeout(() => { showTyping(false); taReply(userMsg); }, delay);
}
function showTyping(on){
  const t = document.getElementById('typingTip');
  if(!t) return;
  if(on){ t.style.display = 'block'; t.textContent = S().typingText; }
  else t.style.display = 'none';
}

function taReply(userMsg){
  const st = S();
  const pool = DB.cards.filter(c => !c.blocked && !isGroupBlocked(c.group));
  if(!pool.length) return;

  let quote = null;
  if(st.quoteOn && Math.random() * 100 < st.quoteChance){
    const recent = DB.messages.filter(m => m.from === 'me').slice(-10);
    if(recent.length) quote = recent[rand(0, recent.length - 1)];
  }
  const qObj = quote ? {id: quote.id, from: quote.from, text: quoteText(quote)} : null;

  const n = rand(1, 3);
  const picked = sample(pool, n);

  if(st.comboOn && picked.length > 1){
    const texts = picked.filter(c => c.type !== 'sticker').map(c => c.text);
    if(texts.length){
      addMsg({from: 'ta', type: 'text', text: texts.join(st.comboSep), quote: qObj});
    } else {
      picked.forEach((c, i) => addMsg({from: 'ta', type: 'sticker', text: c.text, quote: i === 0 ? qObj : null}));
    }
  } else {
    picked.forEach((c, i) => {
      setTimeout(() => addMsg({
        from: 'ta', type: c.type || 'text', text: c.text,
        quote: i === 0 ? qObj : null
      }), i * rand(500, 1100));
    });
  }
}
function userSend(text, extra){
  if(!text && !extra) return;
  const msg = Object.assign({from: 'me', type: 'text', text}, extra || {});
  addMsg(msg);
  playSendSound();
  scheduleReply(msg);
}

  const prevDays = new Date(y, m, 0).getDate();
  let cells = '';
  for(let i = first - 1; i >= 0; i--) cells += `<div class="cal-day dim">${prevDays - i}</div>`;
  for(let i = 1; i <= days; i++){
    const isToday = i === d;
    const mark = DB.cal.events.some(e => {
      const ed = new Date(e.date);
      return ed.getFullYear() === y && ed.getMonth() === m && ed.getDate() === i;
    });
    cells += `<div class="cal-day ${isToday?'today':''} ${mark?'mark':''}">${i}</div>`;
  }
  const rest = (7 - ((first + days) % 7)) % 7;
  for(let i = 1; i <= rest; i++) cells += `<div class="cal-day dim">${i}</div>`;

  const next = DB.cal.events.filter(e => e.type === 'anniversary' && new Date(e.date).getTime() > Date.now())
    .sort((a,b) => new Date(a.date) - new Date(b.date))[0];
  let annText = '';
  if(next){
    const diff = Math.ceil((new Date(next.date) - new Date(y, m, d)) / 86400000);
    annText = `<div style="font-size:11px;color:var(--sub);margin-top:10px;letter-spacing:1px">${esc(next.name)} · 还有 ${diff} 天</div>`;
  }
  return `<div class="cal-widget" data-app="calendar" style="${DB.cal.bg ? `background-image:url('${DB.cal.bg}')` : ''}">
    <div class="cal-head"><div class="cal-month">${m + 1}月</div><div class="cal-year">${y}</div></div>
    <div class="cal-grid">
      <div class="wd">日</div><div class="wd">一</div><div class="wd">二</div><div class="wd">三</div>
      <div class="wd">四</div><div class="wd">五</div><div class="wd">六</div>
      ${cells}
    </div>
    ${annText}
  </div>`;
}

/* =========================================================
   通话
========================================================= */
let callState = null;
function startCall(){
  if(callState) return;
  const st = S();
  const overlay = document.createElement('div');
  overlay.className = 'call-overlay';
  overlay.innerHTML = `
    <div class="call-av">${st.ta.avatar ? `<img src="${st.ta.avatar}">` : esc(st.ta.name.slice(0,1))}</div>
    <div style="text-align:center">
      <div class="call-name">${esc(st.ta.name)}</div>
      <div class="call-time" data-time>00:00</div>
      <div class="call-status" data-status>正在呼叫…</div>
    </div>
    <div class="call-btns">
      <button class="call-btn" data-min>${icon('min',20)}<span>缩小</span></button>
      <button class="call-btn hangup" data-hang>${icon('phone',20)}<span>挂断</span></button>
    </div>`;
  document.body.appendChild(overlay);
  callState = {el: overlay, start: 0, timer: null, connected: false, minimized: false};
const status = overlay.querySelector('[data-status]');
  const timeEl = overlay.querySelector('[data-time]');
  const answerDelay = rand(2000, 5000);
  const willAnswer = Math.random() < 0.82;

  callState.answerTimer = setTimeout(() => {
    if(!callState) return;
    if(willAnswer){
      callState.connected = true;
      callState.start = Date.now();
      status.textContent = '通话中';
      callState.timer = setInterval(() => {
        if(!callState) return;
        timeEl.textContent = fmtHM(Date.now() - callState.start);
      }, 1000);
    } else {
      status.textContent = '对方未接听';
      timeEl.textContent = '';
      setTimeout(() => endCall(false), 1600);
    }
  }, answerDelay);

  overlay.querySelector('[data-hang]').onclick = () => endCall(true);
  overlay.querySelector('[data-min]').onclick = () => toggleMinCall();

  /* ---- 悬浮窗拖动：去掉过渡 + 指针捕获，跟手灵敏 ---- */
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  overlay.addEventListener('pointerdown', e => {
    if(!callState || !callState.minimized) return;
    if(e.target.closest('button')) return;
    dragging = true;
    const r = overlay.getBoundingClientRect();
    sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
    overlay.style.transition = 'none';          // 关键：拖动时禁用过渡，避免延迟感
    try{ overlay.setPointerCapture(e.pointerId); }catch(err){}
  });
  overlay.addEventListener('pointermove', e => {
    if(!dragging) return;
    const maxX = window.innerWidth - overlay.offsetWidth - 4;
    const maxY = window.innerHeight - overlay.offsetHeight - 4;
    const nx = Math.max(4, Math.min(maxX, ox + (e.clientX - sx)));
    const ny = Math.max(4, Math.min(maxY, oy + (e.clientY - sy)));
    overlay.style.left = nx + 'px';
    overlay.style.top = ny + 'px';
    overlay.style.right = 'auto';
    overlay.style.bottom = 'auto';
  });
  overlay.addEventListener('pointerup', e => {
    if(!dragging) return;
    dragging = false;
    overlay.style.transition = '';
    try{ overlay.releasePointerCapture(e.pointerId); }catch(err){}
  });
  overlay.addEventListener('pointercancel', () => {
    dragging = false;
    overlay.style.transition = '';
  });
}

function toggleMinCall(){
  if(!callState) return;
  callState.minimized = !callState.minimized;
  callState.el.classList.toggle('mini', callState.minimized);
  if(callState.minimized){
    callState.el.style.right = '16px';
    callState.el.style.bottom = '100px';
    callState.el.style.left = 'auto';
    callState.el.style.top = 'auto';
  } else {
    callState.el.style.cssText = '';
    callState.el.className = 'call-overlay';
  }
}
function endCall(record){
  if(!callState) return;
  clearTimeout(callState.answerTimer);
  clearInterval(callState.timer);
  const connected = callState.connected;
  callState.el.remove();
  if(record && connected){
    addMsg({from: 'sys', type: 'sys', text: `通话结束 · 时长 ${fmtHM(Date.now() - callState.start)}`});
  } else if(record && !connected){
    addMsg({from: 'sys', type: 'sys', text: `通话未接通`});
  }
  callState = null;
}

function filteredCards(){
  let list = DB.cards.slice();
  if(cardFilter.q){
    const q = cardFilter.q.toLowerCase();
    list = list.filter(c => (c.text || '').toLowerCase().includes(q) || (c.group || '').toLowerCase().includes(q));
  }
  if(cardFilter.group) list = list.filter(c => c.group === cardFilter.group);
  if(cardFilter.sort === 'text') list.sort((a,b) => String(a.text).localeCompare(String(b.text)));
  else if(cardFilter.sort === 'time') list.sort((a,b) => (a.time || 0) - (b.time || 0));
  return list;
}

function bindCards(el){
  const re = () => renderPage('cards');
  const search = el.querySelector('#cardSearch');

  el.querySelector('[data-batch]').onclick = () => batchAddDialog();

re();

      }

      closeSheet(mask);

      DB.cards.push({id: uid(), text: t, group: g, type: 'text', blocked: false, time: Date.now()});

      saveDB(); renderPage('cards');
      toast('已添加');

  });

function batchAddDialog(){
  const groupOptions = DB.groups.map(g => `<option value="${esc(g.name)}">${esc(g.name)}</option>`).join('');
  const mask = openSheet(`
    <div class="sheet-title">批量添加</div>
    <div style="font-size:11px;color:var(--sub);margin-bottom:8px;line-height:1.6">每行一张，若在文本内使用 [分组名] 则优先使用文本中的分组</div>

      <select class="inp" id="batchGroup" style="flex:1;padding:9px 10px;">
        <option value="默认">不分组 (默认)</option>
        ${groupOptions}
        <option value="__new__">+ 新建分组</option>
      </select>
    </div>

    <textarea class="ta" id="batchText" placeholder="[问候]&#10;你好&#10;在吗&#10;[日常]&#10;吃饭了吗"></textarea>
    <div class="sheet-btns">
      <button class="btn ghost" data-no>取消</button>
      <button class="btn primary" data-yes>添加</button>
    </div>`, m => {
    m.querySelector('[data-no]').onclick = () => closeSheet(m);
    m.querySelector('[data-yes]').onclick = () => {
      const raw = m.querySelector('#batchText').value;
      let defaultGroup = m.querySelector('#batchGroup').value;
      
      if(defaultGroup === '__new__'){
        promptBox('新建分组', '', newG => {
          if(!newG || !newG.trim()) return toast('已取消');
          defaultGroup = newG.trim();
          doBatch(raw, defaultGroup);
        });
        return;
      }
      doBatch(raw, defaultGroup);
    };

    function doBatch(raw, defaultG) {
      closeSheet(mask);
      let cur = defaultG;
      let added = 0, dup = 0;
      raw.split('\n').forEach(line => {
        const s = line.trim();
        if(!s) return;
        const gm = s.match(/^\[(.+)\]$/);
        if(gm){
          cur = gm[1].trim();
          if(!DB.groups.find(g => g.name === cur)) DB.groups.push({id: uid(), name: cur, blocked: false});
          return;
        }
        if(DB.cards.some(c => c.text === s && c.group === cur)){ dup++; return; }
        DB.cards.push({id: uid(), text: s, group: cur, type: 'text', blocked: false, time: Date.now()});
        added++;
      });
      if(!DB.groups.find(g => g.name === cur)) DB.groups.push({id: uid(), name: cur, blocked: false});
      saveDB(); renderPage('cards');
      toast(`添加 ${added} 张${dup ? `，跳过重复 ${dup}` : ''}`);
    }
  });
  return mask;
}

function exportCards(){
  let out = '';
  const byGroup = {};
  DB.cards.forEach(c => {
    if(c.type === 'sticker') return;
    const g = c.group || '默认';
    (byGroup[g] = byGroup[g] || []).push(c.text);
  });
  Object.keys(byGroup).forEach(g => {
    out += `[${g}]\n` + byGroup[g].join('\n') + '\n';
  });
  downloadFile('字卡库_' + fmtDate(Date.now()) + '.txt', out);
  toast('已导出');
}

function importCards(){
  pickFile('.txt,text/plain', f => readAsText(f, text => {
    let cur = '默认', added = 0, dup = 0;
    text.split('\n').forEach(line => {
      const s = line.trim();
      if(!s) return;
      const gm = s.match(/^\[(.+)\]$/);
      if(gm){
        cur = gm[1].trim();
        if(!DB.groups.find(g => g.name === cur)) DB.groups.push({id: uid(), name: cur, blocked: false});
        return;
      }
      if(DB.cards.some(c => c.text === s && c.group === cur)){ dup++; return; }
      DB.cards.push({id: uid(), text: s, group: cur, type: 'text', blocked: false, time: Date.now()});
      added++;
    });
    saveDB(); renderPage('cards');
    toast(`导入 ${added} 张${dup ? `，跳过 ${dup} 张重复` : ''}`);
  }));
}

function bindMe(el){

  };

    }));
  };

    confirmBox('确定重置所有数据？此操作不可恢复', () => {

      <input class="inp" id="gDesc" placeholder="介绍" style="margin-bottom:10px">
      <button class="btn ghost full" data-gicon style="margin-bottom:10px">上传图标</button>
      <div class="sheet-btns">
        <button class="btn ghost" data-no>取消</button>
        <button class="btn primary" data-yes>添加</button>
      </div>`, m => {
      let iconUrl = '';
      const gi = m.querySelector('[data-gicon]');
      gi.onclick = () => pickFile('image/*', f => readAsDataURL(f, u => { iconUrl = u; gi.textContent = '已选择图标'; }));
      m.querySelector('[data-no]').onclick = () => closeSheet(m);
      m.querySelector('[data-yes]').onclick = () => {
        const n = m.querySelector('#gName').value.trim();
        const p = m.querySelector('#gPrice').value.trim();
        const d = m.querySelector('#gDesc').value.trim();
        if(!n || !p) return toast('请填写名称和价格');
        DB.shop.products.push({id:uid(), name:n, price:p, desc:d, icon:iconUrl});
        saveDB(); closeSheet(m); renderPage('shop');
      };
    });
  };
  el.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
    const p = DB.shop.products.find(x => x.id === b.dataset.buy);
    if(!p) return;
    confirmBox(`购买 ${p.name}（¥${p.price}）？`, () => {
      DB.shop.orders.push({id:uid(), name:p.name, price:p.price, time:Date.now(), from:'me'});
      saveDB(); renderPage('shop');
      toast('购买成功');
    });
  });
}
/* =========================================================
   音乐
========================================================= */
function qrSVG(){
  let cells = '';
  const n = 21;
  for(let y = 0; y < n; y++){
    for(let x = 0; x < n; x++){
      const corner = (x < 7 && y < 7) || (x > n - 8 && y < 7) || (x < 7 && y > n - 8);
      const on = corner || Math.random() > 0.55;
      if(on) cells += `<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`;
    }
  }
  return `<svg viewBox="0 0 ${n} ${n}" width="124" height="124">${cells}</svg>`;
}

function tplMusic(){
  const songs = DB.music.songs;
  const tg = DB.music.together;
  return `
    <div class="topbar">
      <button class="ibtn" data-back>${icon('back')}</button>
      <div class="tb-title">音乐</div>
      <div class="tb-right"><button class="ibtn" data-addsong>${icon('plus',20)}</button></div>
    </div>
    <div class="page-inner pad">
      <div class="card">
        <div class="sheet-title" style="margin-bottom:10px">扫码登录</div>
        <div class="qr">${qrSVG()}</div>
        <div style="text-align:center;font-size:11px;color:var(--sub);margin-top:10px">网易云 / 汽水音乐</div>
      </div>

      <div class="card" style="display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="letter-spacing:1px">一起听歌</div>
          <div style="font-size:11px;color:var(--sub);margin-top:4px">${tg ? '正在一起听 · ' + fmtHM(Date.now() - tg.start) : '邀请对方一起听'}</div>
        </div>
        <button class="btn sm ${tg?'primary':'ghost'}" data-together>${tg?'结束':'邀请'}</button>
      </div>

      <div class="sec-title">歌单</div>
      ${songs.length ? songs.map((s,i) => `<div class="song">
        <div style="width:34px;height:34px;border-radius:8px;background:var(--hover);display:flex;align-items:center;justify-content:center">${icon('music',16)}</div>
        <div style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)}</div>
        <button class="ibtn" data-playsong="${i}" style="width:30px;height:30px">${icon('play',16)}</button>
      </div>`).join('') : `<div class="empty">暂无歌曲</div>`}
    </div>`;
}

function bindMusic(el){
  el.querySelector('[data-addsong]').onclick = () => {
    openSheet(`
      <div class="sheet-title">添加歌曲</div>
      <input class="inp" id="songName" placeholder="歌曲名" style="margin-bottom:10px">
      <input class="inp" id="songUrl" placeholder="歌曲链接" style="margin-bottom:10px">
      <div class="sheet-btns">
        <button class="btn ghost" data-file>本地文件</button>
        <button class="btn primary" data-yes>添加</button>
      </div>`, m => {
      m.querySelector('[data-file]').onclick = () => pickFile('audio/*', f => readAsDataURL(f, u => {
        DB.music.songs.push({id:uid(), name:f.name.replace(/\.[^.]+$/, ''), url:u});
        saveDB(); closeSheet(m); renderPage('music');
      }));
      m.querySelector('[data-yes]').onclick = () => {
        const n = m.querySelector('#songName').value.trim();
        const u = m.querySelector('#songUrl').value.trim();
        if(!n || !u) return toast('请填写完整');
        DB.music.songs.push({id:uid(), name:n, url:u});
        saveDB(); closeSheet(m); renderPage('music');
      };
    });
  };
  el.querySelectorAll('[data-playsong]').forEach(b => b.onclick = () => {
    const s = DB.music.songs[+b.dataset.playsong];
    if(!s) return;
    try{ const a = new Audio(s.url); a.volume = 0.7; a.play().catch(() => toast('无法播放')); }catch(e){ toast('无法播放'); }
  });
  const tg = el.querySelector('[data-together]');
  if(tg) tg.onclick = () => {
    if(DB.music.together){ DB.music.together = null; saveDB(); renderPage('music'); return; }
    DB.music.together = {start: Date.now()};
    saveDB(); renderPage('music');
    addMsg({from:'sys', type:'sys', text:`${S().me.name} 邀请 ${S().ta.name} 一起听歌`});
    setTimeout(() => addMsg({from:'sys', type:'sys', text:`${S().ta.name} 接受了邀请`}), rand(1500, 3000));
  };
}
/* =========================================================
   陪伴
========================================================= */
function tplCompany(){
  const c = DB.company;
  const modes = [
    {k:'work', n:'工作'},
    {k:'school', n:'学校'},
    {k:'sleep', n:'睡觉'}
  ];
  const active = c.mode && c.start;
  return `
    <div class="topbar">
      <button class="ibtn" data-back>${icon('back')}</button>
      <div class="tb-title">陪伴</div>
      <div class="tb-right"></div>
    </div>
    <div class="page-inner pad">
      <div class="card">
        <div class="big-timer" id="companyTimer">${active ? fmtHM(Date.now() - c.start) : '00:00'}</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
          ${modes.map(m => `<button class="mode-btn ${c.mode === m.k ? 'on' : ''}" data-mode="${m.k}">${m.n}</button>`).join('')}
        </div>
      </div>

      <div class="sec-title">提醒</div>
      <div class="card">
        <div class="row"><div class="row-label">喝水</div><button class="btn sm ghost" data-tip="喝水">提醒</button></div>
        <div class="row"><div class="row-label">吃饭</div><button class="btn sm ghost" data-tip="吃饭">提醒</button></div>
        <div class="row"><div class="row-label">休息</div><button class="btn sm ghost" data-tip="休息">提醒</button></div>
      </div>

      <div class="sec-title">记录</div>
      ${c.records.length ? c.records.slice(-10).reverse().map(r => `<div class="card" style="padding:10px 14px;margin-bottom:8px;font-size:12px;color:var(--sub)">${esc(r)}</div>`).join('') : `<div class="empty">暂无记录</div>`}
    </div>`;
}

function bindCompany(el){
  el.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    const k = b.dataset.mode;
    if(DB.company.mode === k){ DB.company.mode = null; DB.company.start = null; }
    else { DB.company.mode = k; DB.company.start = Date.now(); }
    saveDB(); renderPage('company');
  });
  el.querySelectorAll('[data-tip]').forEach(b => b.onclick = () => {
    const t = b.dataset.tip;
    addMsg({from:'sys', type:'sys', text:`${S().ta.name} 提醒你${t}`});
    DB.company.records.push(`${fmtTime(Date.now())} ${t}提醒`);
    saveDB(); renderPage('company');
  });
  if(DB.company.start){
    if(window._compTimer) clearInterval(window._compTimer);
    window._compTimer = setInterval(() => {
      const t = document.getElementById('companyTimer');
      if(t && DB.company.start) t.textContent = fmtHM(Date.now() - DB.company.start);
      else { clearInterval(window._compTimer); window._compTimer = null; }
    }, 1000);
  }
}
/* =========================================================
   主循环（定时任务）
========================================================= */
function startLoop(){
  setInterval(() => {
    const now = Date.now();
    const st = S();

    // 主动消息
    if(st.autoOn){
      if(!DB.meta.nextAuto) DB.meta.nextAuto = now + rand(st.autoMin * 60000, st.autoMax * 60000);
      else if(now >= DB.meta.nextAuto){
        taReply(null);
        DB.meta.nextAuto = now + rand(st.autoMin * 60000, st.autoMax * 60000);
      }
      saveDB();
    }

    // 朋友圈
    if(st.autoMomentOn){
      if(!DB.meta.nextMoment) DB.meta.nextMoment = now + rand(20, 60) * 60000;
      else if(now >= DB.meta.nextMoment){
        taMoment();
        DB.meta.nextMoment = now + rand(30, 90) * 60000;
      }
      saveDB();
    }

    // 日记
    if(st.autoDiaryOn){
      if(!DB.meta.nextDiary) DB.meta.nextDiary = now + rand(30, 80) * 60000;
      else if(now >= DB.meta.nextDiary){
        taDiary();
        DB.meta.nextDiary = now + rand(40, 120) * 60000;
      }
      saveDB();
    }

    // 陪伴提醒
    if(st.remindOn && DB.company.mode){
      if(!DB.meta.nextRemind) DB.meta.nextRemind = now + st.remindFreq * 60000;
      else if(now >= DB.meta.nextRemind){
        const tips = ['喝水', '吃饭', '休息'];
        const t = tips[rand(0, 2)];
        addMsg({from:'sys', type:'sys', text:`${S().ta.name} 提醒你${t}`});
        DB.meta.nextRemind = now + st.remindFreq * 60000;
        saveDB();
      }
    }

    // 一起听歌邀请
    if(st.togetherInviteOn){
      if(!DB.meta.nextTogether) DB.meta.nextTogether = now + st.togetherFreq * 60000;
      else if(now >= DB.meta.nextTogether){
        addMsg({from:'sys', type:'sys', text:`${S().ta.name} 邀请你一起听歌`});
        DB.meta.nextTogether = now + st.togetherFreq * 60000;
        saveDB();
      }
    }
  }, 1000);
}
/* =========================================================
   初始化
========================================================= */
function init(){
  loadDB();

  if(!DB.cards.length){
    const preset = ['在呢', '嗯嗯', '怎么了', '刚看到消息', '好呀', '今天过得怎么样', '我在忙，稍等', '想你了'];
    DB.cards = preset.map(t => ({id:uid(), text:t, group:'默认', type:'text', blocked:false, time:Date.now()}));
  }
  if(!DB.groups.length) DB.groups = [{id:uid(), name:'默认', blocked:false}];
  saveDB();

  applyTheme();
const pb = localStorage.getItem('SIYU_PAGE_BG');
  if(pb) document.documentElement.style.setProperty('--page-bg', `url('${pb}')`);

  getPage('home').classList.add('active');
  renderPage('home');
  updateAllBadges();

  setTimeout(() => {
    const sp = document.getElementById('splash');
    if(sp){ sp.classList.add('out'); setTimeout(() => sp.remove(), 900); }
  }, 1800);

  startLoop();

  if('Notification' in window && Notification.permission === 'default' && S().notifyOn){
    Notification.requestPermission();
  }
}

init();
</script>
